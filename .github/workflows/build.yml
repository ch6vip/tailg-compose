name: build

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch so rapid pushes do not queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache ~/.gradle/caches + ~/.gradle/wrapper across runs
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}
          gradle-home-cache-includes: |
            caches
            wrapper

      # Cache Android SDK packages (platforms, build-tools) so setup-android
      # does not re-download them on every run. The key hashes the version
      # catalogs / build scripts so a toolchain bump invalidates the cache
      # instead of silently reusing stale SDK packages forever.
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.os == 'Linux' && '~/.android' || '' }}
            /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Assemble + unit tests + lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      # Catch R8/ProGuard keep-rule regressions without requiring a release keystore.
      - name: Assemble release (unsigned minify)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Always publish reports (even on failure) so CI reds are debuggable
      # without reproducing locally.
      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      # Prune stale artifacts from previous runs so the shared account-level
      # 500MB artifact quota stays flat. Quota is per-account, and usage only
      # recalculates every 6-12h, so this prevents new build-up rather than
      # freeing space instantly (run `gh api .../actions/artifacts` + DELETE
      # once manually to clear existing backlog).
      - name: Prune old artifacts
        if: always()
        continue-on-error: true
        run: |
          set +e
          gh api "repos/ch6vip/tailg-compose/actions/artifacts?per_page=100" \
            --paginate --jq '.artifacts[].id' |
            while read -r id; do
              echo "deleting artifact $id"
              gh api -X DELETE "repos/ch6vip/tailg-compose/actions/artifacts/$id" || true
            done
