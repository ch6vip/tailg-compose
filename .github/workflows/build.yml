name: build

# `on` quoted: bare `on:` is a YAML 1.1 boolean alias (like `yes`/`no`),
# which some parsers resolve to `true` instead of the events key.
'on':
  push:
    branches: [master, develop]
    # paths-ignore is deliberately NOT applied to pull_request: if `build`
    # is ever a required status check, a docs-only PR would never report it
    # and GitHub would block the merge on "Expected — waiting for status".
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch so rapid pushes do not queue up.
# Manual dispatch keeps its own group: a hand-triggered run is not cancelled
# by a later push, and vice versa.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: artifact retention is handled by `retention-days`, so the
# old "Prune old artifacts" step (and the `actions: write` it needed) is gone.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Do not leave the token behind in .git/config for later steps
          # (or a compromised dependency) to read.
          persist-credentials: false

      # The wrapper jar is the one binary we execute straight out of the repo,
      # so validate its checksum before it runs anything.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # gradlew now carries the exec bit in git; kept as a cheap safety net
      # in case a checkout on another platform drops it again.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Restore the release keystore from Secrets into $RUNNER_TEMP (outside
      # the workspace, so it never lands in an artifact or a cache).
      # PRs deliberately never get it: a fork PR must not be able to
      # exfiltrate the production signing key. PR releases build unsigned,
      # which is all the R8 smoke test needs.
      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set — building unsigned."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Write the cache from the default branch only. A branch can read
          # its own cache plus the default branch's, so letting feature
          # branches or develop write adds entries nobody can reuse.
          #
          # It must not be read-only *everywhere* though: the cache then
          # never refills, so a single dependency bump changes the key and
          # every build after it is cold — permanently. That also kills the
          # local build cache (org.gradle.caching keeps build-cache-1 inside
          # ~/.gradle/caches, which is in the cache scope below).
          #
          # Write volume is not a quota risk: GitHub now LRU-evicts caches
          # that exceed the account limit, and gradle-home-cache-cleanup
          # prunes the gradle home before it is saved.
          #
          # (This is spelled out because it is the behaviour we want, not
          # because the action lacks it: since v6 the built-in default is
          # `github.ref_name != github.event.repository.default_branch`,
          # which is the same thing. Keeping it explicit makes the intent
          # survive a version bump.)
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/master' }}
          gradle-home-cache-includes: |
            caches
            wrapper

      # NOTE: no Android SDK cache here on purpose. The runner image already
      # ships platforms/build-tools, and caching the whole /usr/local/lib/android/sdk
      # only burned cache budget while spamming "tar: Cannot change mode:
      # Operation not permitted" on every restore.

      # One invocation on purpose:
      #   - --continue surfaces test, lint and R8 failures in a single run
      #     instead of one round trip per category;
      #   - we pay daemon start + configuration once instead of twice.
      - name: Assemble + unit tests + lint
        env:
          # Empty on PRs -> app/build.gradle.kts skips signing entirely and
          # emits an unsigned release APK (see the signingConfigs block).
          STORE_FILE: ${{ github.event_name != 'pull_request' && format('{0}/release.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEY_PASSWORD || '' }}
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleRelease --continue --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      # Signed APKs stay out of PR artifacts: on a public repo, artifacts are
      # downloadable by anyone with read access. (Stopgap until the release
      # keystore is moved out of the repo into Secrets — see docs/CI_REVIEW.md.)
      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # Always publish reports (even on failure) so CI reds are debuggable
      # without reproducing locally.
      - name: Upload test, lint & compose reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/test-results/
            app/build/compose_compiler/
          if-no-files-found: ignore
          retention-days: 7
