name: build

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache ~/.gradle/caches + ~/.gradle/wrapper across runs
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}
          gradle-home-cache-includes: |
            caches
            wrapper

      # Cache Android SDK packages (platforms, build-tools) so setup-android
      # does not re-download them on every run.
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.os == 'Linux' && '~/.android' || '' }}
            /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}
          restore-keys: |
            android-sdk-

      - name: Assemble + unit tests + lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      # Catch R8/ProGuard keep-rule regressions without requiring a release keystore.
      - name: Assemble release (unsigned minify)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
