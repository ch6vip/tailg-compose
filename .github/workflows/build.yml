name: build

# `on` quoted: bare `on:` is a YAML 1.1 boolean alias (like `yes`/`no`),
# which some parsers resolve to `true` instead of the events key.
'on':
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch so rapid pushes do not queue up.
# Manual dispatch keeps its own group: a hand-triggered run is not cancelled
# by a later push, and vice versa.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache ~/.gradle/caches + ~/.gradle/wrapper across runs.
          # Read-only on ALL branches: the gradle-dependencies cache is
          # ~600MB per write, so letting master/develop write a fresh entry
          # every push grows the account-level 500MB Actions storage quota
          # faster than pruning can reclaim it. Read-only keeps cache hits
          # (Gradle deps are stable) while never adding new entries.
          cache-read-only: true
          gradle-home-cache-includes: |
            caches
            wrapper

      # NOTE: no Android SDK cache here on purpose. The runner image already
      # ships platforms/build-tools, and caching the whole /usr/local/lib/android/sdk
      # only burned cache budget while spamming "tar: Cannot change mode:
      # Operation not permitted" on every restore.

      - name: Assemble + unit tests + lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      # Catch R8/ProGuard keep-rule regressions without requiring a release keystore.
      - name: Assemble release (unsigned minify)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          compression-level: 9

      - name: Upload signed release APK
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 3
          compression-level: 9

      # Always publish reports (even on failure) so CI reds are debuggable
      # without reproducing locally.
      - name: Upload test & lint reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      # Prune stale artifacts so the shared account-level 500MB artifact
      # quota stays flat, while keeping the newest 3 (latest APK + reports)
      # downloadable from the Actions page. Quota is per-account and usage
      # only recalculates every 6-12h, so this prevents new build-up rather
      # than freeing space instantly.
      - name: Prune old artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --paginate --jq '.artifacts | sort_by(.created_at) | .[:-3][] | .id' |
            while read -r id; do
              echo "deleting artifact $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            done

      # Prune old Actions caches. The Gradle cache keys (gradle-home-v1,
      # gradle-transforms-v1, ...) accumulate one entry per build; a single
      # stale android-sdk cache once held 4.6GB and, together with artifacts,
      # blew through the account-level 500MB Actions storage quota. Cache
      # deletion is immediate (unlike the usage snapshot, which lags 6-12h),
      # so pruning here keeps the quota flat run over run. Keep the newest 2
      # entries per key family (by created_at): they are the ones the next
      # build actually hits. Key family = first dash-delimited token
      # (gradle-home-v1, ...), so different content-hash variants of the same
      # family share a bucket.
      - name: Prune old caches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/${{ github.repository }}/actions/caches?per_page=100" \
            --paginate --jq '[.actions_caches[] | {id, key, created_at}] | group_by(.key | split("|")[0] | split("-")[0:3] | join("-")) | .[] | sort_by(.created_at) | .[:-2][] | .id' |
            while read -r id; do
              echo "deleting cache $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" || true
            done

