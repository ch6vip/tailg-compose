name: build

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch so rapid pushes do not queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache ~/.gradle/caches + ~/.gradle/wrapper across runs
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}
          gradle-home-cache-includes: |
            caches
            wrapper

      # NOTE: no Android SDK cache here on purpose. The runner image already
      # ships platforms/build-tools, and caching the whole /usr/local/lib/android/sdk
      # only burned hundreds of MB of cache budget while spamming
      # "tar: Cannot change mode: Operation not permitted" on every restore.

      - name: Assemble + unit tests + lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      # Catch R8/ProGuard keep-rule regressions without requiring a release keystore.
      - name: Assemble release (unsigned minify)
        run: ./gradlew assembleRelease --stacktrace

      # Each run used to leave ~34 MB of APK + reports behind with the default
      # 90-day retention, which blew through the 500 MB artifact quota after
      # ~15 pushes ("Failed to CreateArtifact: Artifact storage quota has been
      # hit"). Cap retention and compress so usage stays roughly flat.
      - name: Upload debug APK
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          compression-level: 9

      # Always publish reports (even on failure) so CI reds are debuggable
      # without reproducing locally.
      - name: Upload test & lint reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9
